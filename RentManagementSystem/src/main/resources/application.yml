server:
  port: 8085



spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/Housingcolony
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
    


  jpa:
    hibernate:
    
      ddl-auto: validate  # Or "none", "create", "create-drop", "validate"
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Optional: Enable SQL logging
  sql:
    init:
      mode: always
      
      
      eureka:
      
       client:
       service-url:
         defaultZone: http://localhost:8761/eureka/
       instance:
         prefer-ip-address: true 
  application:
    name: Employee-service      
